name: CI/CD Pipeline - Bookstore API Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  BASE_URL: https://fakerestapi.azurewebsites.net
  ENV: github-actions

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: mvn clean compile -DskipTests
  
  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        java-version: ['11', '17']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Create test directories
      run: |
        mkdir -p test-output logs
    
    - name: Run tests with Maven
      run: mvn clean test -DBASE_URL=${{ env.BASE_URL }} -DENV=${{ env.ENV }}
      continue-on-error: true
    
    - name: Archive ExtentReports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extent-report-java-${{ matrix.java-version }}
        path: test-output/extent-report.html
        retention-days: 30
    
    - name: Archive test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-java-${{ matrix.java-version }}
        path: |
          test-output/
          logs/
        retention-days: 30
    
    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: |
          test-output/**/*.xml
        check_name: Test Results (Java ${{ matrix.java-version }})

  docker-build-test:
    name: Build and Test with Docker
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t bookstore-api-tests:latest .
    
    - name: Create output directories in container
      run: |
        docker run --rm -v $(pwd)/test-output:/app/test-output -v $(pwd)/logs:/app/logs \
          bookstore-api-tests:latest mkdir -p /app/test-output /app/logs || true
    
    - name: Run tests in Docker container
      run: |
        docker run --rm \
          -e BASE_URL=${{ env.BASE_URL }} \
          -e ENV=${{ env.ENV }} \
          -v $(pwd)/test-output:/app/test-output \
          -v $(pwd)/logs:/app/logs \
          bookstore-api-tests:latest
      continue-on-error: true
    
    - name: Archive Docker test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-test-reports
        path: |
          test-output/
          logs/
        retention-days: 30

  publish-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [test, docker-build-test]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Prepare summary
      run: |
        echo "# Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Maven Tests: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Tests: Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
        ls -la artifacts/ >> $GITHUB_STEP_SUMMARY || echo "No artifacts found"
    
    - name: Archive final reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: final-test-results
        path: artifacts/
        retention-days: 7

